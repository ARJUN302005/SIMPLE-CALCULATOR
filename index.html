<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMPLE-CALCULATOR</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div class="container">
    <input type="text" readonly value="0" class="display" />
    <div class="btn-container">
      <button class="btn fn">AC</button>
      <button class="btn fn">&larr;</button>
      <button class="btn operator">&percnt;</button>
      <button class="btn operator">&divide;</button>
      <button class="btn num">7</button>
      <button class="btn num">8</button>
      <button class="btn num">9</button>
      <button class="btn operator">&times;</button>
      <button class="btn num">4</button>
      <button class="btn num">5</button>
      <button class="btn num">6</button>
      <button class="btn operator">&minus;</button>
      <button class="btn num">1</button>
      <button class="btn num">2</button>
      <button class="btn num">3</button>
      <button class="btn operator">&plus;</button>
      <button class="btn num">0</button>
      <button class="btn num">00</button>
      <button class="btn num">.</button>
      <button class="btn fn">&equals;</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
